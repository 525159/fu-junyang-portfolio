<path d="M0 41h181v481H14q-14 0-14-14z" fill="#f0f3ea"/><rect x="23" y="68" width="26" height="26" rx="8" fill="#617d48"/><text x="31" y="86" font-size="19" fill="#fff">✳</text><text x="60" y="87" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="600" fill="#4f613d">拾光</text><text x="24" y="127" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#a0ab95">YOUR LITTLE SPACE</text><rect x="16" y="148" width="148" height="36" rx="6" fill="#dfe8d3"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#748567"><text x="35" y="171">✦　所有灵感</text><text x="35" y="216">▦　我的收藏夹</text><text x="35" y="259">♡　最近喜欢</text><text x="35" y="302">⊙　正在探索</text></g><path d="M24 332h132" stroke="#dfe5d6"/><text x="30" y="362" font-family="Arial,sans-serif" font-size="9" fill="#96a28b">COLLECTIONS</text><circle cx="34" cy="389" r="3" fill="#a9b888"/><circle cx="34" cy="419" r="3" fill="#cbad8d"/><text x="47" y="393" font-size="10" font-family="Microsoft YaHei,sans-serif" fill="#819071">一些小想法</text><text x="47" y="423" font-size="10" font-family="Microsoft YaHei,sans-serif" fill="#819071">以后想做的事</text><text x="26" y="493" font-size="9" font-family="Arial,sans-serif" fill="#a6af9d">LESS NOISE. MORE IDEAS.</text>
<text x="216" y="92" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="600" fill="#48583d">给灵感，一个停留的地方。</text><text x="217" y="116" font-family="Microsoft YaHei,Arial,sans-serif" font-size="10" fill="#9aa68c">收集那些一闪而过的念头，让好想法慢慢生长。</text><rect x="823" y="78" width="108" height="33" rx="6" fill="#617b4b"/><text x="842" y="99" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#fff">＋ 记录灵感</text><rect x="216" y="144" width="56" height="23" rx="11" fill="#e9efdf"/><text x="231" y="159" font-family="Microsoft YaHei,sans-serif" font-size="9" fill="#7f916c">全部</text><text x="289" y="159" font-family="Microsoft YaHei,sans-serif" font-size="9" fill="#9ea994">想法</text><text x="337" y="159" font-family="Microsoft YaHei,sans-serif" font-size="9" fill="#9ea994">链接</text><text x="385" y="159" font-family="Microsoft YaHei,sans-serif" font-size="9" fill="#9ea994">设计灵感</text>
<rect x="217" y="190" width="222" height="273" rx="9" fill="#f0f2e5"/><circle cx="327" cy="277" r="62" fill="#e0e7cc"/><path d="M313 260q31-42 49-8t-8 50q-45 10-52-19t34-40" fill="none" stroke="#8ea36b" stroke-width="3"/><path d="m313 223 16 22 21-21m-46 77-19 17m74-11 21 16" fill="none" stroke="#8ea36b" stroke-width="2"/><text x="237" y="373" font-size="17" font-family="Microsoft YaHei,sans-serif" fill="#65764d">灵感不必很大。</text><text x="237" y="399" font-size="10" font-family="Microsoft YaHei,sans-serif" fill="#9aa387">从一个小小的念头开始，</text><text x="237" y="417" font-size="10" font-family="Microsoft YaHei,sans-serif" fill="#9aa387">也许就是下一件作品。</text><rect x="237" y="438" width="47" height="14" rx="3" fill="#e1e7d2"/><text x="245" y="448" font-size="7" font-family="Arial,sans-serif" fill="#96a181">THOUGHT</text>
<rect x="455" y="190" width="225" height="154" rx="9" fill="#f6eadc"/><text x="474" y="221" font-size="9" font-family="Arial,sans-serif" letter-spacing="1" fill="#b2977e">WHAT IF…</text><text x="474" y="257" font-size="17" font-family="Microsoft YaHei,sans-serif" fill="#9d7d60">做一个只属于自己的</text><text x="474" y="282" font-size="17" font-family="Microsoft YaHei,sans-serif" fill="#9d7d60">数字小花园？</text><path d="M475 311h105" stroke="#d8bea1" stroke-width="3" stroke-linecap="round"/><rect x="455" y="360" width="225" height="103" rx="9" fill="#e9eeed"/><text x="474" y="393" font-size="14" font-family="Microsoft YaHei,sans-serif" fill="#819491">慢一点，也没关系。</text><text x="474" y="419" font-size="10" font-family="Microsoft YaHei,sans-serif" fill="#a0adaa">让每个想法都有生长的时间。</text><text x="474" y="449" font-size="8" font-family="Arial,sans-serif" fill="#a4b1ab">ONE STEP AT A TIME ↗</text>
<rect x="697" y="190" width="234" height="208" rx="9" fill="#e7edf0"/><circle cx="815" cy="257" r="33" fill="#d2dee1"/><path d="M801 255q18-16 28 1t-11 19" stroke="#94abb3" stroke-width="2" fill="none"/><text x="716" y="333" font-size="16" font-family="Microsoft YaHei,sans-serif" fill="#7c929b">看到喜欢的，就记下来。</text><text x="716" y="359" font-size="9" font-family="Microsoft YaHei,sans-serif" fill="#9aadb3">关于设计，也关于生活。</text><rect x="697" y="414" width="234" height="49" rx="7" fill="#f6f7f2" stroke="#e7eadf" stroke-dasharray="4 4"/><text x="758" y="443" font-size="10" font-family="Microsoft YaHei,sans-serif" fill="#a3ad95">＋ 下一个小想法</text></g>
